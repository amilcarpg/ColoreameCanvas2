name: Check mobile (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve exact dependencies
        working-directory: flutter
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        working-directory: flutter
        run: flutter analyze --no-pub
      - name: Test
        working-directory: flutter
        run: flutter test --no-pub
      - name: Android debug smoke build without ads
        working-directory: flutter
        run: flutter build apk --debug --no-pub --dart-define=PAINTME_ADS=disabled
      - name: Save test-only APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-test-only
          path: flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
