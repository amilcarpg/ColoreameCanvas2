name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Generate assets and run checks manually on the developer's computer.
  # Publish the committed web directory without rebuilding or testing it here.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revision to publish
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Record deployed revision
        run: echo "Published revision $GITHUB_SHA (checks are manual and local)" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
